name: Deploy to AWS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  

permissions:
  id-token: write   # Required for requesting the OIDC JWT
  contents: read    # Required to check out code

jobs:
  aws-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC subject claim
        run: |
          token=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "sub=$(echo $token | jq -R 'split(".") | .[1] | @base64d | fromjson | .sub' -r)"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Test AWS Connectivity
        run: |
          aws sts get-caller-identity